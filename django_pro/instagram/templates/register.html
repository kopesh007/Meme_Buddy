{% extends 'base.html'%}

{% block "content" %}

    <!-- ================= REGISTER PAGE ================= -->

    <main class="register-page">


        <!-- LEFT SIDE -->




        <!-- RIGHT SIDE -->

        <section class="register-form-section">

            <div class="register-card">


                <!-- HEADING -->

                <div class="register-heading">

                    <div class="register-mobile-logo">
                        Meme<span>Buddy</span> 😂
                    </div>

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        Join Meme Buddy and start sharing laughs!
                    </p>

                </div>



                <!-- MESSAGE -->

                <div class="register-message success-message">

                    {% include 'include/error.html'%}

                </div>


                <!-- ERROR MESSAGE EXAMPLE -->

                <!--
                <div class="register-message error-message">

                    ❌ Passwords do not match!

                </div>
                -->



                <!-- FORM -->

                <form method="post">
                    {% csrf_token %}


                    <!-- USERNAME -->

                    <div class="register-form-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="register-input-wrapper">

                            <span>👤</span>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                required
                            >

                        </div>

                    </div>



                    <!-- EMAIL -->

                    <div class="register-form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="register-input-wrapper">

                            <span>📧</span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="register-form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="register-input-wrapper">

                            <span>🔒</span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="register-form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <div class="register-input-wrapper">

                            <span>🔐</span>

                            <input
                                type="password"
                                id="confirm-password"
                                name="c_password"
                                placeholder="Confirm your password"
                                required
                            >

                        </div>

                    </div>



                    <!-- TERMS -->

                    <div class="register-terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label for="terms">

                            I agree to the
                            <a href="#">Terms & Conditions</a>

                        </label>

                    </div>



                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="register-button"
                    >
                        Create Account 🚀
                    </button>


                </form>



                <!-- LOGIN -->

                <div class="register-login">

                    Already have an account?

                    <a href="#">
                        Login
                    </a>

                </div>


            </div>

        </section>


    </main>


{% endblock %}
