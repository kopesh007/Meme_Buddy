{% if messages %}

    {% for i in messages %}

        <div class="django-message {{ i.tags }}">
            <span>{{ i }}</span>
        </div>

    {% endfor %}

{% endif %}




{% if form.non_field_errors %}
{% for error in form.non_field_errors%}
        <h1>{{error}}</h1>
{% endfor %}
{% endif %}
